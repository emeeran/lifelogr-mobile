[package]
name = "lifelogr"
version = "0.1.0"
description = "Lightweight, local-first journal and notes"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lifelogr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled SQLite (compiled with FTS5) so search works identically on every platform.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Small binaries, low memory: this is a "lightweight" app first.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
